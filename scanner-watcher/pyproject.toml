[project]
name = "meishidb-scanner-watcher"
version = "0.1.0"
description = "Watch a folder for scanned card images and import them into meishiDB"
requires-python = ">=3.11"
dependencies = [
    "watchdog>=4.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["watcher"]
