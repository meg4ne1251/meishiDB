[project]
name = "meishidb-api"
version = "0.1.0"
description = "meishiDB backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "structlog>=24.1",
    "itsdangerous>=2.2",
    "email-validator>=2.1",
    "minio>=7.2",
    "pillow>=10.3",
    "meilisearch-python-sdk>=3.0",
    "webauthn>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
