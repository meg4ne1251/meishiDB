[project]
name = "meishidb-api"
version = "0.1.0"
description = "meishiDB backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.14.2",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "python-multipart>=0.0.31",
    "structlog>=24.1",
    "itsdangerous>=2.2",
    "email-validator>=2.1",
    "minio>=7.2",
    "pillow>=12.3.0",
    "meilisearch-python-sdk>=3.0",
    "webauthn>=2.0",
    # Security floors for dependencies used by FastAPI, MinIO, WebAuthn and Meili.
    "starlette>=1.3.1",
    "anyio>=4.14.2",
    "urllib3>=2.8.0",
    "cryptography>=50.0.0",
    "pyasn1>=0.6.4",
    "pyjwt>=2.15.0",
    "httpx2[http2]>=2.12.0",
    "httpcore2>=2.10.0",
    "h2>=4.4.1",
    "hpack>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
