services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: meishi
      POSTGRES_PASSWORD: meishi
      POSTGRES_DB: meishi
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meishi -d meishi"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    build:
      context: ./minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-meishi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-meishi-storage-secret}
    volumes:
      - storage_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  search:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-meili-master-key-change-me}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - search_data:/meili_data
    ports:
      - "127.0.0.1:7700:7700"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  ocr:
    build:
      context: ../ocr
    volumes:
      - ocr_models:/root/.paddleocr
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  api:
    build:
      context: ../api
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-secret-please-change}
      DATABASE_URL: postgresql+asyncpg://meishi:meishi@db:5432/meishi
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      OCR_SERVICE_URL: http://ocr:8000
      GEOCODER_URL: ${GEOCODER_URL:-}
      MEILISEARCH_URL: http://search:7700
      MEILISEARCH_KEY: ${MEILI_MASTER_KEY:-meili-master-key-change-me}
      MINIO_ENDPOINT: http://storage:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-meishi}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-meishi-storage-secret}
      MINIO_BUCKET_ORIGINAL: cards-original
      MINIO_BUCKET_THUMB: cards-thumb
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_RP_NAME: meishiDB
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:3000}
      SCANNER_API_TOKEN: ${SCANNER_API_TOKEN:-}
      SCANNER_OWNER_EMAIL: ${SCANNER_OWNER_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
      search:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ../api:/app

  web:
    build:
      context: ../web
      target: dev
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
      NEXT_PUBLIC_MAP_TILE_URL: ${NEXT_PUBLIC_MAP_TILE_URL:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    volumes:
      - ../web:/app
      - /app/node_modules

  # 任意起動：sheetfed scanner などが書き出すフォルダを監視して自動投入
  # `docker compose --profile scanner up` で起動する
  scanner-watcher:
    profiles: ["scanner"]
    build:
      context: ../scanner-watcher
    environment:
      API_URL: http://api:8000
      SCAN_DIR: /scans
      SCAN_PROCESSED_DIR: /scans/_processed
      SCAN_FAILED_DIR: /scans/_failed
      SCANNER_API_TOKEN: ${SCANNER_API_TOKEN:-}
    volumes:
      - scanner_inbox:/scans
    depends_on:
      - api

  # 任意起動：住所→座標のジオコーディング（地図機能用）。
  # `GEOCODER_URL=http://geocoder:8080 docker compose --profile geocoder up` で起動。
  # 注意: 初回起動時に OSM 抽出データ（PBF）をインポートするため重く、時間もかかる。
  # 日本のみで十分なので Geofabrik の japan-latest を既定にしている。
  geocoder:
    profiles: ["geocoder"]
    image: mediagis/nominatim:4.4
    environment:
      PBF_URL: ${NOMINATIM_PBF_URL:-https://download.geofabrik.de/asia/japan-latest.osm.pbf}
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:-nominatim-change-me}
      IMPORT_STYLE: address
    volumes:
      - geocoder_data:/var/lib/postgresql/14/main
    ports:
      - "127.0.0.1:8080:8080"
    shm_size: 1gb

  # 任意起動：セルフホストの地図タイルサーバ（地図機能用）。
  # `docker compose --profile tileserver up` で起動し、フロントは
  # NEXT_PUBLIC_MAP_TILE_URL=http://<ホスト>:8081/styles/basic/{z}/{x}/{y}.png を指す。
  # 注意: タイルデータ(.mbtiles)は同梱しない（外部送信ゼロを保つための前提）。
  # OpenMapTiles 等から取得した `tiles.mbtiles` を ./tiles に置いてから起動すること。
  tileserver:
    profiles: ["tileserver"]
    image: maptiler/tileserver-gl:v4.11.0
    command: ["--mbtiles", "/data/tiles.mbtiles"]
    volumes:
      - ./tiles:/data
    ports:
      - "127.0.0.1:8081:8080"

  # 公開ホスト用: production.yml を重ねて `--profile proxy up` で起動
  proxy:
    profiles: ["proxy"]
    image: caddy:2
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-meishi.local}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - api

volumes:
  db_data:
  ocr_models:
  storage_data:
  search_data:
  scanner_inbox:
  geocoder_data:
  caddy_data:
  caddy_config:
