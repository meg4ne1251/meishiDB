[project]
name = "meishidb-ocr"
version = "0.1.0"
description = "PaddleOCR FastAPI worker for meishiDB"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.31",
    "pillow>=12.3.0",
    "starlette>=1.3.1",
    "anyio>=4.14.2",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "paddlepaddle>=2.6,<3.0",
    "paddleocr>=2.7,<3.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
