[project]
name = "meishidb-ocr"
version = "0.1.0"
description = "PaddleOCR FastAPI worker for meishiDB"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pillow>=10.3",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "paddlepaddle>=2.6,<3.0",
    "paddleocr>=2.7,<3.0",
    "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
